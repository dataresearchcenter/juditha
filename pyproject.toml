[project]
name = "juditha"
version = "4.6.0"
description = "A super-fast canonical name lookup service"
authors = [{ name = "Simon Wörpel", email = "simon.woerpel@pm.me" }]
license = "AGPLv3+"
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "anystore (>=1.2.6,<2.0.0)",
    "followthemoney (>=4.10.2,<5.0.0)",
    "ftmq[level] (>=5.0.0,<6.0.0)",
    "rigour (>=2.3.1,<3.0.0)",
    "rapidfuzz (>=3.14.5,<4.0.0)",
    "jellyfish (>=1.2.1,<2.0.0)",
    "ahocorasick-rs (>=1.0.3,<2.0.0)",
    "tantivy (>=0.26.0,<0.27.0)",
    "grpcio (>=1.83.0,<2.0.0)",
    "protobuf (>=6.0.0,<8.0.0)",
]

[project.scripts]
juditha = "juditha.cli:cli"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^9.0.1"
flake8 = "^7.3.0"
pre-commit = "^4.2.0"
bump2version = "^1.0.1"
pytest = "^9.1.1"
pytest-coverage = "^0.0"
pytest-env = "^1.0.1"
mypy = "^2.3.0"
zensical = "^0.0.50"
ipdb = "^0.13.13"
ipython = "^9.16.1"
grpcio-tools = ">=1.83.0,<2.0.0"
types-grpcio = "^1.83.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest_env]
DEBUG = 1

# The juditha/rpc/juditha_pb2*.py* modules are generated by `make proto`.
# Keep them exactly as protoc emits them so regenerating produces no diff.
[tool.black]
extend-exclude = "/juditha/rpc/juditha_pb2.*\\.pyi?$"

[tool.isort]
profile = "black"
extend_skip_glob = ["juditha/rpc/juditha_pb2*"]

[tool.mypy]
strict = true

# protoc's output is not --strict clean and google.protobuf ships no stubs
[[tool.mypy.overrides]]
module = ["juditha.rpc.juditha_pb2", "juditha.rpc.juditha_pb2_grpc"]
ignore_errors = true
ignore_missing_imports = true

# the generated grpc plumbing (JudithaStub, add_*_to_server) is untyped, and
# it is called from these two modules
[[tool.mypy.overrides]]
module = ["juditha.rpc.client", "juditha.rpc.server"]
disallow_untyped_calls = false
